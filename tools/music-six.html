<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROYGBIV / six musiques</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#12061f;color:#c8b0e8;
    font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:0 0 40px}
  header{padding:12px 16px;background:#1c0c2e;border-bottom:1px solid #3a1c5c;
    position:sticky;top:0;z-index:2;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  header b{color:#ffc61e;letter-spacing:2px}
  #list{max-width:820px;margin:0 auto;padding:14px}
  .tr{background:#1a0a2c;border:1px solid #3a1c5c;border-radius:6px;
    padding:12px 14px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
  .tr.on{border-color:#c04ff0;background:#241040}
  .tr .txt{flex:1;min-width:0}
  .tr h3{margin:0 0 4px;font-size:14px;color:#fff}
  .tr p{margin:0 0 6px;color:#9b83c0}
  .tr .meta{color:#5f5080;font-size:11px}
  button{background:#3a1c5c;color:#e8d8ff;border:1px solid #6b3fa0;border-radius:4px;
    padding:9px 14px;cursor:pointer;font:inherit;white-space:nowrap}
  button:hover{background:#4d2578}
  button.play{background:#1f7a4a;border-color:#2fd68a;min-width:88px}
  canvas{display:block;width:100%;height:44px;margin-top:8px;background:#0d0518;border-radius:3px}
  input[type=range]{width:120px;accent-color:#c04ff0}
  label{display:flex;gap:6px;align-items:center}
</style>
<header>
  <b>SIX MUSIQUES</b>
  <button id="stop">stop</button>
  <label>volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.45"></label>
  <label>tempo <input id="tempo" type="range" min="0.6" max="1.6" step="0.05" value="1"></label>
  <span id="tempov">x1</span>
  <span style="opacity:.55">clique sur ecouter, ca boucle</span>
</header>
<div id="list"></div>
<script>
/* =====================================================================
   Six pistes pour ROYGBIV, ecrites avec EXACTEMENT le moteur du jeu:
   un ordonnanceur a double croche avec 0,25 s d'avance, et une seule
   fonction mTone. Celle que tu choisis se recolle telle quelle dans
   index.html en remplacant musFn, SCALE, PROG et BPM.
   Outil de dev, ne part pas dans le zip.
   ===================================================================== */

var AC=null, musGain=null, musOn=0, musNext=0, musStep=0, STEP16=0;
var cur=-1, TEMPO=1, VOL=0.45;
var rnd=Math.random;
function ri(n){ return rnd()*n|0; }
function hz(s){ return 220*Math.pow(2,s/12); }

// identique au jeu, a la note pres
function mTone(f,t,d,type,v,det){
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f; if(det) o.detune.value=det;
  o.connect(g); g.connect(musGain);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.start(t); o.stop(t+d+0.04);
  viz(v);
}
// bruit blanc court, pour les percussions
function mNoise(t,d,v,hp){
  var n=AC.sampleRate*d|0, b=AC.createBuffer(1,n,AC.sampleRate), c=b.getChannelData(0);
  for(var i=0;i<n;i++) c[i]=(rnd()*2-1)*(1-i/n);
  var s=AC.createBufferSource(); s.buffer=b;
  var f=AC.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||900;
  var g=AC.createGain(); g.gain.value=v;
  s.connect(f); f.connect(g); g.connect(musGain); s.start(t);
  viz(v);
}

/* =====================================================================
   LES SIX PISTES
   Chacune: bpm, gamme, grille d accords, et la fonction de double croche.
   ===================================================================== */
var TRACKS=[
{
 n:'1. LA MENACE ROSE',
 d:'Ce qui tourne aujourd hui dans le jeu. Mineur harmonique, basse carree a la noire, arpege epars. Sombre, discret, ne fatigue pas.',
 m:'132 bpm, mineur harmonique, ne se fait pas remarquer',
 bpm:132, scale:[0,2,3,5,7,8,10], prog:[0,-4,3,-2],
 f:function(i,t,S,P,st){ var bar=(i/16|0), r=P[bar%4], b=i%16;
   if(b%4===0) mTone(hz(r-24),t,st*3,'square',0.12);
   if(b%8===2) mTone(hz(r-12),t,0.1,'triangle',0.06);
   if(b===0||b===6||b===10) mTone(hz(r+S[(b*3)%7]),t,0.3,'triangle',0.05,6);
   if(rnd()<0.16) mTone(hz(r+S[ri(7)]+12),t,0.4,'sine',0.04,4); }
},
{
 n:'2. CHASSE AU GALOP',
 d:'Chiptune nerveux a la double croche, basse qui court sans arret, caisse claire sur le 2 et le 4. Ca pousse a avancer et ca colle au fusil a pompe.',
 m:'168 bpm, mineur naturel, energie constante',
 bpm:168, scale:[0,2,3,5,7,8,10], prog:[0,0,-4,-4,3,3,-2,-5],
 f:function(i,t,S,P,st){ var bar=(i/16|0), r=P[bar%8], b=i%16;
   mTone(hz(r-24+(b%4===2?7:0)),t,st*0.9,'square',0.085);   // basse galopante
   if(b%8===4||b%8===0) mNoise(t,0.05,0.06,2600);            // charleston
   if(b===4||b===12) mNoise(t,0.11,0.14,1400);               // caisse claire
   if(b%2===0){ var n=S[(b*5+bar)%7];
     mTone(hz(r+n+12),t,0.09,'square',0.05,8); }
   if(b===0||b===10) mTone(hz(r+S[(bar*2)%7]+24),t,0.22,'triangle',0.045); }
},
{
 n:'3. LA VALSE DES LICORNES',
 d:'Une valse a trois temps de boite a musique, sucree et un peu fausse, pendant que tu massacres. Le contrepied comique. Risque: ca peut lasser sur une longue partie.',
 m:'150 bpm en 3 temps, majeur, boite a musique detonnee',
 bpm:150, scale:[0,2,4,5,7,9,11], prog:[0,5,-2,7],
 f:function(i,t,S,P,st){ var bar=(i/12|0), r=P[bar%4], b=i%12;
   if(b===0) mTone(hz(r-24),t,st*2,'sine',0.12);             // le temps fort
   if(b===4||b===8){ mTone(hz(r+S[2]),t,st*1.2,'triangle',0.04);
     mTone(hz(r+S[4]),t,st*1.2,'triangle',0.035,7); }        // pom pom
   if(b%2===0){ var n=S[(b*3+bar*2)%7]+24;
     mTone(hz(n+r),t,0.5,'sine',0.05,ri(24)-12);             // melodie qui detonne
     mTone(hz(n+r)*2.01,t,0.3,'sine',0.018); } }
},
{
 n:'4. ORAGE DE CRIN',
 d:'Doom lent. Un bourdon grave desaccorde qui ne s arrete jamais, un riff a la blanche, une cymbale sale. Rend chaque tir enorme. Peut ecraser les bruitages.',
 m:'88 bpm, phrygien, bourdon permanent',
 bpm:88, scale:[0,1,3,5,7,8,10], prog:[0,0,1,-4],
 f:function(i,t,S,P,st){ var bar=(i/16|0), r=P[bar%4], b=i%16;
   if(b===0){ mTone(hz(r-36),t,st*15,'sawtooth',0.075,-9);   // le bourdon
              mTone(hz(r-36),t,st*15,'sawtooth',0.06,11); }
   if(b===0||b===6){ mTone(hz(r-12),t,st*4,'sawtooth',0.09,-5);
                     mTone(hz(r-12+S[3]),t,st*4,'sawtooth',0.05,6); }
   if(b===0||b===8) mNoise(t,0.35,0.055,180);                // grosse caisse
   if(b===12) mNoise(t,0.5,0.035,3800);                      // cymbale sale
   if(b===14) mTone(hz(r+S[1]+12),t,0.7,'triangle',0.04,-14); }
},
{
 n:'5. ITALO ARC-EN-CIEL',
 d:'Disco quatre temps, arpege brillant qui monte, clap sur les temps pairs. Festif et mechant a la fois, tres proche de l esprit du titre. Le plus dansant.',
 m:'126 bpm, mineur, arpege ascendant',
 bpm:126, scale:[0,3,7,10,12,15,19], prog:[0,-2,-4,-5],
 f:function(i,t,S,P,st){ var bar=(i/16|0), r=P[bar%4], b=i%16;
   if(b%4===0){ mTone(hz(r-24),t,0.16,'sine',0.16);          // pied
                mNoise(t,0.09,0.05,140); }
   if(b===4||b===12) mNoise(t,0.13,0.09,1800);               // clap
   if(b%4===2) mNoise(t,0.04,0.045,4200);                    // charleston ouverte
   var n=S[b%7]+(b>7?12:0);
   mTone(hz(r+n),t,0.11,'sawtooth',0.038,6);                 // arpege qui monte
   if(b%8===0) mTone(hz(r-12),t,st*4,'triangle',0.05,-4); }
},
{
 n:'6. LA BOITE CASSEE',
 d:'Une boite a musique qui se derregle a mesure que la partie avance: le tempo tient mais les notes glissent et le grave s installe. Superbe idee, mais elle demande que je branche la progression du jeu dessus.',
 m:'120 bpm, majeur qui pourrit, derive progressive',
 bpm:120, scale:[0,2,4,7,9,12,14], prog:[0,0,-3,-3],
 f:function(i,t,S,P,st){ var bar=(i/16|0), r=P[bar%4], b=i%16,
     rot=Math.min(1,(i%512)/512);                            // la derive
   if(b%8===0) mTone(hz(r-24-rot*5),t,st*3,'sine',0.1+rot*0.05);
   if(b%2===0){ var n=S[(b*3+bar)%7]+24;
     mTone(hz(r+n)-rot*22,t,0.55-rot*0.2,'sine',0.055,rot*-40);
     if(rot>0.4) mTone(hz(r+n)*0.503,t,0.4,'triangle',0.03*rot); }
   if(rot>0.55&&b%4===2) mNoise(t,0.06,0.03*rot,600);        // le mecanisme grince
   if(rot>0.8&&b===15) mTone(hz(r-36),t,st*6,'sawtooth',0.07,-20); }
}];

/* =====================================================================
   Lecture
   ===================================================================== */
var VU=0;
function viz(v){ VU=Math.min(1,VU+v*2.2); }

function stopAll(){
  musOn=0;
  if(musGain){ try{ musGain.gain.cancelScheduledValues(AC.currentTime);
    musGain.gain.setValueAtTime(musGain.gain.value,AC.currentTime);
    musGain.gain.linearRampToValueAtTime(0,AC.currentTime+0.12); }catch(e){} }
  cur=-1; paint();
}
function play(k){
  if(cur===k){ stopAll(); return; }
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(AC.state==='suspended') AC.resume();
  stopAll();
  cur=k; musOn=1;
  musGain=AC.createGain(); musGain.gain.value=0; musGain.connect(AC.destination);
  musGain.gain.linearRampToValueAtTime(VOL,AC.currentTime+0.6);
  var T=TRACKS[k];
  STEP16=60/(T.bpm*TEMPO)/4;
  musNext=AC.currentTime+0.12; musStep=0;
  paint();
}
setInterval(function(){
  if(!AC||!musOn||cur<0) return;
  var T=TRACKS[cur], a=AC.currentTime+0.25;
  while(musNext<a){ T.f(musStep,musNext,T.scale,T.prog,STEP16);
    musNext+=STEP16; musStep++; }
},60);

/* interface */
var list=document.getElementById('list'), html='';
TRACKS.forEach(function(T,k){
  html+='<div class="tr" id="tr'+k+'"><div class="txt">'+
    '<h3>'+T.n+'</h3><p>'+T.d+'</p><div class="meta">'+T.m+'</div>'+
    '<canvas id="cv'+k+'"></canvas></div>'+
    '<button class="play" data-k="'+k+'">ecouter</button></div>';
});
list.innerHTML=html;
list.addEventListener('click',function(e){
  var k=e.target.getAttribute('data-k'); if(k===null) return; play(+k); });
document.getElementById('stop').onclick=stopAll;
document.getElementById('vol').oninput=function(){ VOL=+this.value;
  if(musGain) try{ musGain.gain.value=VOL; }catch(e){} };
document.getElementById('tempo').oninput=function(){ TEMPO=+this.value;
  document.getElementById('tempov').textContent='x'+TEMPO.toFixed(2);
  if(cur>=0) STEP16=60/(TRACKS[cur].bpm*TEMPO)/4; };

function paint(){ TRACKS.forEach(function(T,k){
  var row=document.getElementById('tr'+k);
  row.className='tr'+(k===cur?' on':'');
  row.querySelector('button').textContent=(k===cur)?'stop':'ecouter'; }); }

/* petit oscilloscope par piste, juste pour voir que ca vit */
var HIST=[];
setInterval(function(){
  HIST.push(VU); if(HIST.length>140) HIST.shift(); VU*=0.55;
  TRACKS.forEach(function(T,k){
    var cv=document.getElementById('cv'+k), d=devicePixelRatio||1;
    if(cv.width!==cv.clientWidth*d){ cv.width=cv.clientWidth*d; cv.height=44*d; }
    var g=cv.getContext('2d'); g.setTransform(d,0,0,d,0,0);
    g.clearRect(0,0,cv.clientWidth,44);
    if(k!==cur) return;
    g.strokeStyle='#c04ff0'; g.lineWidth=2; g.beginPath();
    for(var i=0;i<HIST.length;i++){
      var x=i/139*cv.clientWidth, y=44-2-HIST[i]*38;
      i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke(); });
},40);
paint();
</script>
</html>
