<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ROYGBIV</title>
<style>
html,body{margin:0;height:100%;background:#160a26;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
</style></head><body><canvas id=c></canvas><script>
"use strict";
// =====================================================================
//  ROYGBIV - js13kGames 2026 - theme "Unicorns and Rainbows"
//  You are the rainbow. You have a shotgun. Unicorns had it coming.
//  Your 7 colour bands are BOTH your health bar AND your 7 upgrade slots.
// =====================================================================

// ---------- canvas ----------
var C=document.getElementById('c'), X=C.getContext('2d'), W, H, Z=0.74, SC=1;
var AW=3000, AH=3000, camX=0, camY=0;        // le monde, et l'oeil qui le suit
function resize(){ var d=Math.min(2,devicePixelRatio||1);
  C.width=innerWidth*d; C.height=innerHeight*d;
  // le zoom vise une hauteur de vue constante: meme cadrage sur tous les ecrans
  Z=Math.min(1.5,Math.max(0.5,innerHeight/1150));
  W=innerWidth/Z; H=innerHeight/Z; SC=d*Z;
  AW=AH=Math.max(3000,Math.max(W,H)*1.35); }
function camera(){
  camX = AW<=W ? (AW-W)/2 : mx(0,mn(AW-W,P.x-W/2));
  camY = AH<=H ? (AH-H)/2 : mx(0,mn(AH-H,P.y-H/2)); }
addEventListener('resize',resize); resize();

// ---------- helpers ----------
var rnd=Math.random, PI=Math.PI, TAU=6.283185, cos=Math.cos, sin=Math.sin,
    hyp=Math.hypot, atan=Math.atan2, mn=Math.min, mx=Math.max;
function ri(n){ return rnd()*n|0; }
function rr(a,b){ return a+rnd()*(b-a); }

// ---------- palette ----------
// the seven bands, red at the bottom of the arch, violet at the top
var BAND=['#ff3355','#ff8a1f','#ffd42e','#5ce24a','#2fb8ff','#4a5cff','#a33bff'];
var GRAY=['#4a4358','#514a60','#585167','#4f4a5e','#464154','#413c50','#3b3648'];
var FAM=['RAGE','RATE','LIGHT','LIFE','CHILL','ORBIT','BROKEN'];
var BG='#3f7a55';

// ---------- audio ----------
var AC,musGain,musOn=false,musNext=0,musStep=0,STEP16,muted=false;
function ensureAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function snd(f,d,type,v,f2){ if(muted||!ensureAudio()) return; try{
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=f; g.gain.value=v||0.05;
  o.connect(g); g.connect(AC.destination); o.start();
  o.frequency.exponentialRampToValueAtTime(f*(f2||0.5),AC.currentTime+d);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
  o.stop(AC.currentTime+d); }catch(e){} }
function noise(d,v){ if(muted||!ensureAudio()) return; try{
  var n=AC.sampleRate*d|0, b=AC.createBuffer(1,n,AC.sampleRate), c=b.getChannelData(0);
  for(var i=0;i<n;i++) c[i]=(rnd()*2-1)*(1-i/n);
  var s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s.buffer=b; f.type='lowpass'; f.frequency.value=1800; g.gain.value=v||0.2;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); }catch(e){} }
// sfx shorthands
function sShoot(){ noise(0.09,0.16); snd(180,0.09,'square',0.05); }
function sHit(){ snd(300+ri(120),0.05,'square',0.025); }
function sKill(){ snd(140,0.16,'sawtooth',0.045); noise(0.08,0.08); }
function sPick(){ snd(880+ri(300),0.05,'triangle',0.03); }
function sHurt(){ snd(110,0.3,'sawtooth',0.09,0.3); noise(0.2,0.15); }
function sPaint(){ snd(440,0.12,'triangle',0.05,2.4); snd(660,0.2,'sine',0.05,2); }
function sLevel(){ snd(330,0.5,'triangle',0.06,3); }

var SCALE=[0,3,7,10,12,15,19], PROG=[0,-2,-4,-5], BPM=126;
function hz(s){ return 220*Math.pow(2,s/12); }
function mTone(f,t,d,type,v,det){ var o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f; if(det) o.detune.value=det;
  o.connect(g); g.connect(musGain);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d+0.04); }
// percussion: du bruit blanc court, l'enveloppe est cuite dans le tampon
function mNoise(t,d,v){ var n=AC.sampleRate*d|0,
  bf=AC.createBuffer(1,n,AC.sampleRate), c=bf.getChannelData(0), i;
  for(i=0;i<n;i++) c[i]=(rnd()*2-1)*(1-i/n)*v;
  var s=AC.createBufferSource(); s.buffer=bf; s.connect(musGain); s.start(t); }
// ITALO ARC-EN-CIEL: quatre temps, arpege ascendant, clap sur les pairs
function musFn(i,t){ var bar=(i/16|0), r=PROG[bar%4], b=i%16;
  if(b%4===0) mTone(hz(r-24),t,0.16,'sine',0.16);            // le pied
  if(b===4||b===12) mNoise(t,0.13,0.5);                      // le clap
  if(b%4===2) mNoise(t,0.035,0.22);                          // la charleston
  mTone(hz(r+SCALE[b%7]+(b>7?12:0)),t,0.11,'sawtooth',0.038,6);
  if(b%8===0) mTone(hz(r-12),t,STEP16*4,'triangle',0.05,-4); }
function musTick(){ if(!AC||!musOn) return; var a=AC.currentTime+0.25;
  while(musNext<a){ musFn(musStep,musNext); musNext+=STEP16; musStep++; } }
function tempo(){ STEP16=60/(BPM*(0.75+lvl*0.05))/4; }
function startMusic(){ if(musOn||!ensureAudio()) return; musOn=true;
  musGain=AC.createGain(); musGain.gain.value=0; musGain.connect(AC.destination);
  musGain.gain.linearRampToValueAtTime(0.45,AC.currentTime+2);
  tempo(); musNext=AC.currentTime+0.1; musStep=0; setInterval(musTick,60); }

// ---------- couleurs communes a tous les sprites ----------
var OUT='#150719', HORN='#ffd257', HORNH='#fff2b8', DK='#1a0b2b', HOOF='#5b3f7a';

// ---------- vector sprite kit (DA validee au labo) ----------
// Tout est dessine en primitives molles: ellipses, rects arrondis,
// triangles. Style peluche facon Happy Tree Villains. Chaque sprite est
// cuit une fois dans un canvas offscreen puis blitte.
var V;                                    // contexte de dessin courant
function offc(w,h,cx,cy,sc){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  V=c.getContext('2d'); V.translate(cx,cy); if(sc) V.scale(sc,sc);
  return c;
}
function el(x,y,rx,ry,c,rot){ V.save(); V.translate(x,y); if(rot) V.rotate(rot);
  V.scale(rx,ry); V.beginPath(); V.arc(0,0,1,0,TAU); V.restore();
  V.fillStyle=c; V.fill(); }
function elo(x,y,rx,ry,c,o){ el(x,y,rx+(o||.045),ry+(o||.045),OUT); el(x,y,rx,ry,c); }
function rct(x,y,w,h,r,c){ V.beginPath(); V.moveTo(x+r,y);
  V.arcTo(x+w,y,x+w,y+h,r); V.arcTo(x+w,y+h,x,y+h,r);
  V.arcTo(x,y+h,x,y,r); V.arcTo(x,y,x+w,y,r); V.closePath();
  V.fillStyle=c; V.fill(); }
function tri(ax,ay,bx,by,cx,cy,c){ V.beginPath(); V.moveTo(ax,ay);
  V.lineTo(bx,by); V.lineTo(cx,cy); V.closePath(); V.fillStyle=c; V.fill(); }
function strk(c,w){ V.strokeStyle=c; V.lineWidth=w; V.lineCap='round'; V.stroke(); }
// l'oeil vitreux, enorme, la signature du style
function eyeq(x,y,r,lk){ elo(x,y,r,r*1.05,'#fff',.03);
  el(x+lk*r*.3,y+r*.12,r*.52,r*.62,DK);
  el(x+lk*r*.3-r*.16,y-r*.18,r*.19,r*.19,'#fff'); }

// une licorne, de profil trois quarts, tournee vers la droite.
function mkUni(b,sh,m,md){
  var c=offc(92,100,46,50,42), i, a;
  el(-.72,-.05,.2,.3,m,.2); el(-.8,.18,.15,.22,md,.2);      // queue
  rct(-.5,.5,.19,.5,.09,sh); rct(-.24,.55,.19,.45,.09,b);   // pattes arriere
  rct(.12,.5,.19,.5,.09,sh); rct(.34,.55,.19,.45,.09,b);
  V.fillStyle=HOOF; V.fillRect(-.49,.92,.17,.08); V.fillRect(.35,.97,.17,.08);
  elo(-.05,.24,.52,.4,b);                                    // corps
  el(-.05,.34,.44,.28,sh); el(-.05,.14,.44,.28,b);
  elo(.44,-.3,.42,.38,b);                                    // tete
  el(.72,-.14,.24,.19,b); el(.78,-.12,.2,.15,'rgba(255,255,255,.32)');
  el(.83,-.17,.035,.045,sh);                                 // naseau
  for(i=0;i<7;i++){ a=-.6-i*.42;                             // criniere
    el(.44+cos(a)*.4,-.3+sin(a)*.44,.2-i*.014,.22-i*.014,i%2?m:md); }
  tri(.4,-.6,.62,-.56,.56,-1.08,OUT);                        // corne
  tri(.43,-.62,.59,-.59,.56,-1.02,HORN); tri(.47,-.62,.54,-.6,.55,-.9,HORNH);
  eyeq(.34,-.32,.155,1); eyeq(.63,-.32,.135,1);
  el(.3,-.05,.1,.07,'#ff6fa8');                              // blush
  V.beginPath(); V.arc(.66,-.05,.1,.2,2.6); strk(DK,.045);   // sourire
  return c;
}

// une tete de licorne seule: sert au boss et aux tetes qui volent.
function xe(x,y,r){ V.beginPath(); V.moveTo(x-r,y-r); V.lineTo(x+r,y+r);
  V.moveTo(x+r,y-r); V.lineTo(x-r,y+r); strk(DK,r*.42); }
function mkHead(b,sh,m,md,lg,S){
  S=S||24;
  var c=offc(S*2.34,S*2.34,S*1.084,S*1.334,S), i, a;
  c.ox=S*1.084; c.oy=S*1.334;
  for(i=0;i<5;i++){ a=3.3+i*.34;
    el(cos(a)*.62,sin(a)*.66,.28-i*.02,.3-i*.02,i%2?m:md); }
  elo(0,0,.585,.575,b,.03);
  el(.35,.325,.39,.28,b);
  el(.43,.345,.32,.221,'rgba(255,255,255,.3)');
  el(.6,.18,.05,.06,sh);
  tri(-.08,-.477,.24,-.443,.14,-1.2,OUT);
  tri(-.04,-.494,.2,-.46,.13,-1.12,HORN);
  tri(.02,-.494,.08,-.477,.11,-.941,HORNH);
  // lg vaut 0 (sourire ferme), 1 (elle se marre) ou 2 (elle est morte)
  if(lg>1){ xe(-.18,-.095,.2); xe(.305,-.16,.175);
    V.beginPath(); V.arc(.4,.5,.19,3.5,5.9); strk(DK,.1);   // bouche tombante
    el(.62,.42,.09,.14,'#ff5f8f',.4); }                     // langue qui pend
  else {
    eyeq(-.18,-.095,.24,1); eyeq(.305,-.16,.21,1);
    el(-.09,.3,.13,.09,'#ff6fa8');
    if(lg){ elo(.365,.34,.29,.19,'#3a1030',.03);
      el(.365,.44,.14,.08,'#ff5f8f');
      V.fillStyle='#fff'; V.fillRect(.225,.12,.31,.066);
      el(.38,.186,.155,.054,'#fff'); }
    else { V.beginPath(); V.arc(.425,.27,.2,.2,2.6); strk(DK,.126); } }
  return c;
}

// le heros: une arche de 7 bandes, violet en haut, tete de furieux.
// li = bandes encore peintes, lv = bandes debloquees.
var heroCache={};
function heroSpr(li,lv,S){
  S=S||32;
  var k=li*8+lv+S*100, q=heroCache[k]; if(q) return q;
  var c=offc(S*2.2,S*1.5,S*1.1,S*0.46,S), i;
  c.ox=S*1.1; c.oy=S*0.46;
  var R=.98, r0=.44, e=(R-r0)/7, fx=(R+r0)/2, fw=.44,
      lc=li>0?BAND[0]:GRAY[0];
  rct(-fx-fw/2-.04,.5,fw+.08,.44,.15,OUT);                   // un pied sous
  rct(fx-fw/2-.04,.5,fw+.08,.44,.15,OUT);                    // chaque jambe
  rct(-fx-fw/2,.54,fw,.36,.13,lc);
  rct(fx-fw/2,.54,fw,.36,.13,lc);
  V.beginPath(); V.arc(0,.62,R+.05,PI,0); V.arc(0,.62,r0-.05,0,PI,1);
  V.closePath(); V.fillStyle=OUT; V.fill();                  // le contour de l'anneau
  for(i=0;i<7;i++){                                          // rouge dehors, violet dedans
    V.beginPath(); V.arc(0,.62,R-i*e,PI,0); V.arc(0,.62,R-(i+1)*e,0,PI,1);
    V.closePath(); V.fillStyle = i<li?BAND[i] : (i<lv?GRAY[i]:'#2a2140'); V.fill(); }
  eyeq(-.164,-.2,.131,0); eyeq(.164,-.2,.131,0);             // le visage, sur la couronne
  V.beginPath(); V.moveTo(-.312,-.415); V.lineTo(-.041,-.276); strk(DK,.074);
  V.beginPath(); V.moveTo(.312,-.415); V.lineTo(.041,-.276); strk(DK,.074);
  V.beginPath(); V.arc(0,.161,.139,3.5,6); strk(DK,.062);
  return heroCache[k]=c;
}

// le fusil a pompe, canon vers la droite, pivot sur la crosse.
function mkGun(){
  var c=offc(54,28,2,14,1);
  rct(0,-6,44,11,4,OUT);
  rct(2,-4,40,8,3,'#565073'); rct(3,-4,38,3,2,'#9a93c0');
  rct(38,-6,10,12,3,'#2b2740');
  rct(14,4,16,7,3,'#2b2740'); rct(15,4,14,2,1,'#565073');
  rct(0,-2,10,10,3,'#2b2740');
  return c;
}

// floor tiles and blood: pretty on top, filthy underneath.
function mulb(s){ return function(){ s|=0; s=s+0x6D2B79F5|0;
  var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- bestiary ----------
// name, body, light, mane, dark-mane, pixel scale, hp, speed, radius, xp
var ET=[
 ['FOAL',     '#ff9fd4','#d96eb0','#ff3f9e','#d61f7a', 2,   4, 132, 12, 1],
 ['UNICORN',  '#b483e8','#8f5cc9','#ff5fc0','#d63f9e', 3,  13,  86, 19, 2],
 ['GLITTER',  '#7fe5c6','#4fbfa0','#ff7fbf','#d65f9e', 3,  12,  95, 19, 3],
 ['REARER',   '#f5c78e','#d29e63','#7fd8e0','#4fa8b8', 3,  20,  70, 21, 3],
 ['SPITTER',  '#d3aef2','#a97fd0','#7f9fff','#4f6fd6', 3,  16,  66, 19, 4],
 ['BLINKER',  '#ffb3b3','#d98080','#ffd257','#d6a02e', 3,  17,  84, 19, 4],
 ['MOTHER',   '#9fd4ff','#6ea8d9','#c07fff','#8f3fd6', 4,  40,  58, 27, 6]];
var eSpr=ET.map(function(t){ return mkUni(t[1],t[2],t[3],t[4]); });
var eScl=ET.map(function(t){ return t[8]*4.3/92; });
var eHead=ET.map(function(t){ return mkHead(t[1],t[2],t[3],t[4],1,16); });
var bossHead=mkHead('#e9b6ff','#b57fd0','#ff3fd0','#8a1f5e',1);
var bossQuiet=mkHead('#e9b6ff','#b57fd0','#ff3fd0','#8a1f5e',2);
var GUNS=mkGun();
var puds=[];

// ---------- upgrades: 7 families x 3 ----------
// id = family*3 + choice
// 4 pouvoirs par bande, on en tire 3 au hasard a chaque montee.
// Le 3e champ est la forme de la pastille dessinee sur la carte.
var UP=[
 ['EMBER','shots set unicorns on fire',5],
 ['SPITE','+14% damage for every gray band',6],
 ['BUCKSHOT','+60% pellet damage',0],
 ['CHOKE','tight spread, far longer reach',1],
 ['SAWN OFF','+75% fire rate, shorter range',1],
 ['KICKBACK','shots blast unicorns backwards',4],
 ['WIDE LOAD','+3 pellets per shot',0],
 ['PUMP','+38% fire rate, no downside',2],
 ['ARC','pellets jump to a second target',4],
 ['SPRINT','+35% move speed',1],
 ['FLASH','hits stun for a moment',3],
 ['TRACER','pellets carry 70% further',6],
 ['PHOTOSYNTHESIS','bands repaint twice as fast',3],
 ['MAGNET','triple pickup range',2],
 ['THICK SKIN','double invulnerability window',7],
 ['THORNS','whatever touches you gets shredded',1],
 ['FROST','shots slow unicorns to a crawl',6],
 ['DOWNPOUR','rain hurts everything near you',5],
 ['BUBBLE','anything touching you gets launched',2],
 ['UNDERTOW','unicorns near you crawl',7],
 ['STOLEN HORN','an orbiting horn impales',1],
 ['MIRAGE','a decoy rainbow pulls the herd',0],
 ['STORM','a cloud follows you and strikes',4],
 ['HALO','a ring of light grinds anything close',2],
 ['REFRACTION','pellets split in two on impact',6],
 ['SUPERNOVA','losing a band detonates the field',3],
 ['PRISM','pellets pierce straight through',7],
 ['GREED','every kill drops double crumbs',5]];

// ---------- state ----------
var mode='title', T=0, kills=0, shake=0, flashT=0, flashC='#fff';
var P={x:0,y:0,r:14,ifr:0,fireCd:0,ang:0,face:1,bob:0};
var lvl=0, lit=0, slot=[-1,-1,-1,-1,-1,-1,-1], xp=0, need=0, regenT=0;
var ents=[], shots=[], hearts=[], drops=[], parts=[], zaps=[];
var boss=null, bossWarn=0, spawnT=0, cards=[], mirage=null, storm=null;
var orbA=0, rainT=0, stormT=0, bossSpawnT=0, xpFl=0;
var rings=[], gibs=[], pops=[], stars=[], texts=[], freeze=0, dim=0;
function say(x,y,t,c,z){ texts.push({x:x,y:y,t:t,c:c,z:z||1,l:1,dx:rr(-8,8),r:rr(-0.45,0.45)}); }
// une onde de choc: cercle qui s'ouvre et s'efface
function ring(x,y,r0,r1,c,l){ rings.push({x:x,y:y,r:r0,R:r1,c:c,l:l,L:l}); }
function needFor(l){ return 15+l*25; }

function reset(){
  T=0; kills=0; shake=0; lvl=0; lit=0; xp=0; regenT=0; wdHit=0;
  slot=[-1,-1,-1,-1,-1,-1,-1];
  ents=[]; shots=[]; hearts=[]; drops=[]; puds=[]; parts=[]; zaps=[];
  boss=null; bossWarn=0; spawnT=1.2; mirage=null; storm=null; bossSpawnT=0;
  rings=[]; gibs=[]; pops=[]; stars=[]; texts=[]; freeze=0;
  P.x=AW/2; P.y=AH/2; P.vx=0; P.vy=0; P.ifr=0; P.fireCd=0;
  // la bande rouge est offerte, sans choix: on entre directement en jeu
  slot[0]=ri(4); lvl=1; lit=1; xp=0; need=needFor(1);
  tempo();
  recalc(); mode='play';
}

// ---------- derived stats: only LIT bands grant their power ----------
var S={};
function has(u){ for(var i=0;i<lit;i++) if(slot[i]===u) return 1; return 0; }
function recalc(){
  S.spd=205; S.cd=0.44; S.pel=5; S.spr=0.44; S.dmg=3.4; S.rng=0.30; S.mag=160;
  S.knock=90; S.ifr=0.9; S.regen=3.4;
  S.burn=has(0); S.spite=has(1); S.big=has(2); S.choke=has(3);
  S.saw=has(4); S.kick=has(5); S.wide=has(6); S.pump=has(7);
  S.arc=has(8); S.sprint=has(9); S.flash=has(10); S.trace=has(11);
  S.photo=has(12); S.magnet=has(13); S.skin=has(14); S.thorn=has(15);
  S.frost=has(16); S.rain=has(17); S.bubble=has(18); S.tow=has(19);
  S.orb=has(20); S.lure=has(21); S.storm=has(22); S.halo=has(23);
  S.refr=has(24); S.nova=has(25); S.prism=has(26); S.greed=has(27);
  if(S.spite) S.dmg*=1+0.14*(lvl-lit);
  if(S.big) S.dmg*=1.6;
  if(S.saw){ S.cd*=0.57; S.rng*=0.66; }
  if(S.kick) S.knock=340;
  if(S.wide) S.pel+=3;
  if(S.choke){ S.spr*=0.45; S.rng*=1.6; }
  if(S.pump) S.cd*=0.72;
  if(S.trace) S.rng*=1.7;
  if(S.sprint) S.spd*=1.35;
  if(S.photo) S.regen=1.7;
  if(S.magnet) S.mag*=3;
  if(S.skin) S.ifr*=2;
  if(!S.storm) storm=null; else if(!storm) storm={x:P.x,y:P.y};
  if(!S.lure) mirage=null;
}

// ---------- level up ----------
function levelUp(){
  if(lvl>=7) return;
  var f=lvl*4, a=[f,f+1,f+2,f+3], i, j, t;
  for(i=3;i>0;i--){ j=ri(i+1); t=a[i]; a[i]=a[j]; a[j]=t; }   // on melange les 4
  cards=[a[0],a[1],a[2]]; mode='up'; sLevel();
}
function pick(i){
  if(lvl>=7) return;
  dim=0; slot[lvl]=cards[i]; lvl++; tempo(); say(P.x,P.y,UP[cards[i]][0],BAND[lvl-1],1.5); lit++; xp=0; need=needFor(lvl); regenT=0;
  recalc(); mode='play'; sPaint();
  burst(P.x,P.y,BAND[lvl-1],26,260); shake=mn(shake+5,12); flashT=0.18;
  freeze=mx(freeze,0.12); ring(P.x,P.y,10,300,BAND[lvl-1],0.55);
  if(lvl>=7){ bossSpawnT=6; wdAward('FULL_SPECTRUM');
    if(!wdHit) wdAward('UNTOUCHED_ARCH'); }
}

// ---------- particles ----------
function burst(x,y,col,n,spd){ for(var i=0;i<n;i++){ var a=rnd()*TAU, s=(spd||90)*(0.25+rnd());
  parts.push({x:x,y:y,vx:cos(a)*s,vy:sin(a)*s,l:0.3+rnd()*0.5,c:col,s:3}); } }
function rainbowBurst(x,y,n){ for(var i=0;i<n;i++){ var a=rnd()*TAU, s=70+rnd()*230;
  parts.push({x:x,y:y,vx:cos(a)*s,vy:sin(a)*s,l:0.35+rnd()*0.6,c:BAND[ri(7)],s:3+ri(3)}); } }

// ---------- input ----------
// Une seule voie pour la souris, le doigt et le stylet: les Pointer Events.
// Les touchstart bruts se font avaler par certaines webviews et iframes,
// alors que le pointeur passe. Repli sur touch/mouse si le navigateur est vieux.
var keys={}, isTouch=false;
// Joystick repris du projet annexe: aucun identifiant de doigt n'est
// memorise. A chaque evenement on relit e.touches et on recalcule tout.
// Plus de doigt, le stick s'eteint. Il ne peut donc pas rester coince.
var stick={on:0,ox:0,oy:0,dx:0,dy:0,mag:0}, SMAX=76;

addEventListener('keydown',function(e){ var k=e.key.length===1?e.key.toLowerCase():e.key.toLowerCase(); keys[k]=1;
  if(k==='m'){ muted=!muted; if(musGain) musGain.gain.value=muted?0:0.45; }
  if(mode==='up'&&(k==='1'||k==='2'||k==='3')) pick(+k-1);
  if(mode==='title'||mode==='dead'||mode==='win') start(); });
addEventListener('keyup',function(e){ keys[e.key.length===1?e.key.toLowerCase():e.key.toLowerCase()]=0; });

function handleTouches(e){
  e.preventDefault();
  var st=e.touches.length?e.touches[0]:null;
  if(st){ var tx=st.clientX/Z, ty=st.clientY/Z;
    if(!stick.on){ stick.on=1; stick.ox=tx; stick.oy=ty; }
    var dx=tx-stick.ox, dy=ty-stick.oy, d=hyp(dx,dy);
    if(d>SMAX){ dx=dx/d*SMAX; dy=dy/d*SMAX; d=SMAX; }
    stick.dx=dx; stick.dy=dy; stick.mag=d/SMAX;
  } else { stick.on=0; stick.mag=0; stick.dx=stick.dy=0; }
}
C.addEventListener('touchstart',function(e){ isTouch=1;
  for(var i=0;i<e.changedTouches.length;i++)
    click(e.changedTouches[i].clientX/Z,e.changedTouches[i].clientY/Z);
  handleTouches(e); },{passive:false});
C.addEventListener('touchmove',handleTouches,{passive:false});
C.addEventListener('touchend',handleTouches,{passive:false});
C.addEventListener('touchcancel',handleTouches,{passive:false});
C.addEventListener('mousedown',function(e){ click(e.clientX/Z,e.clientY/Z); });

function click(x,y){
  if(mode==='title'||mode==='dead'||mode==='win'){ start(); return; }
  if(mode==='up'){ for(var i=0;i<3;i++){ var r=cardRect(i);
    if(x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3]){ pick(i); return; } } }
}

function start(){ ensureAudio(); startMusic(); reset(); }

// ---------- spawning ----------
// Distance exacte a parcourir depuis le heros pour sortir du cadre visible,
// puis une marge. Le heros n'est pas toujours au centre: quand la camera
// bute sur un bord du monde, il derive vers le bord de l'ecran.
function outOfView(a){
  var ca=cos(a), sa=sin(a),
      tx=ca>0?(camX+W-P.x)/ca:ca<0?(camX-P.x)/ca:1e9,
      ty=sa>0?(camY+H-P.y)/sa:sa<0?(camY-P.y)/sa:1e9,
      t=mn(tx,ty)+90;
  return [P.x+ca*t, P.y+sa*t];
}
function spawnEnemy(type,x,y){
  var t=ET[type];
  if(x===undefined){ var e=ri(4), m=70;
    var ang, q, k;
    // Un demi-tour ne suffit pas: dans un coin du monde, les deux directions
    // opposees sortent de la carte. On tente plusieurs caps jusqu'a en
    // trouver un qui tombe a la fois hors du cadre et dans le monde.
    for(k=0;k<24;k++){
      ang=(!k&&(P.vx||P.vy)&&rnd()<0.55)?atan(P.vy,P.vx)+rr(-1.05,1.05):rnd()*TAU;
      q=outOfView(ang);
      if(q[0]>24&&q[0]<AW-24&&q[1]>24&&q[1]<AH-24) break; }
    if(k>23) return;                  // aucune place hors champ: on renonce
    x=q[0]; y=q[1]; }
  var hp=t[6]*(1+T*0.010);
  ents.push({t:type,x:x,y:y,hp:hp,mhp:hp,r:t[8],spd:t[7]*rr(0.85,1.18)*(1+mn(0.3,T*0.003)),
    fl:0,burn:0,slow:0,stun:0,sh:type===2?1:0,st:0,cd:rr(0.6,2.2),face:1,bob:rnd()*9,orbCd:0,
    // wb/ws/wq: elle louvoie au lieu de foncer droit.
    // ld: une sur deux anticipe ta trajectoire au lieu de te suivre,
    //     sinon il suffit de tourner autour du troupeau pour gagner.
    wb:rnd()*TAU, ws:rr(0.8,2.2)*(rnd()<0.5?-1:1), wq:rr(0.15,0.55),
    ld:rnd()<0.5?rr(0.3,0.85):0});
}
function pickType(){
  var w=[],tot=0,i;
  for(i=0;i<lvl;i++){ var v=(i===lvl-1)?3.2:1; w.push(v); tot+=v; }
  var r=rnd()*tot;
  for(i=0;i<lvl;i++){ r-=w[i]; if(r<=0) return i; }
  return 0;
}

// ---------- damage ----------
function hurtEnemy(e,d,kx,ky,fromShot){
  if(e.sh){ e.sh=0; e.fl=0.2; burst(e.x,e.y,'#ffffff',10,150); sHit(); return; }
  e.hp-=d; e.fl=0.14;
  if(kx!==undefined){ e.x+=kx; e.y+=ky; }
  if(fromShot){
    if(S.burn) e.burn=mx(e.burn,2.6);
    if(S.frost) e.slow=mx(e.slow,1.6);
    if(S.flash) e.stun=mx(e.stun,0.28);
  }
  if(e.hp<=0) killEnemy(e);
  else sHit();
}
function killEnemy(e){
  var i=ents.indexOf(e); if(i<0) return; ents.splice(i,1);
  kills++; if(kills===1) wdAward('FIRST_BLOOD'); else if(kills===100) wdAward('HUNDRED_HORNS');
  if(S.greed) rainbowBurst(e.x,e.y,6+ET[e.t][5]*3); sKill(); rainbowBurst(e.x,e.y,10+ET[e.t][5]*3);
  shake=mn(shake+1.6,10); freeze=mx(freeze,0.045);
  ring(e.x,e.y,e.r*0.4,e.r*2.8,'#fff',0.26);
  ring(e.x,e.y,e.r*0.2,e.r*4.2,ET[e.t][3],0.5);
  // le spectre de la bete, qui gonfle et s'efface
  pops.push({x:e.x,y:e.y,t:e.t,f:e.face,l:0.32,L:0.32});
  for(var sp2=0;sp2<5;sp2++){ var sa=rnd()*TAU, ss=rr(60,190);
    stars.push({x:e.x,y:e.y,vx:cos(sa)*ss,vy:sin(sa)*ss,l:rr(0.3,0.6),
      r:rr(4,9),c:sp2%2?'#fff':ET[e.t][3],rot:rnd()*TAU}); }
  // la tete se detache et continue de sourire en rebondissant
  gibs.push({x:e.x,y:e.y,vx:rr(-130,130),vy:rr(-60,60),z:12,vz:rr(210,400),
    rot:0,vr:rr(-11,11),t:e.t,l:1.6,k:ET[e.t][8]/19});
  var n=ET[e.t][9]*2;
  say(e.x,e.y,'+'+n,'#ffd42e',0.8+n*0.06);
  for(var k=0;k<n;k++) drops.push({x:e.x+rr(-12,12),y:e.y+rr(-12,12),vx:rr(-40,40),vy:rr(-40,40),l:40,c:BAND[ri(7)]});
  puds.push({x:e.x,y:e.y,s:ri(3)}); if(puds.length>60) puds.shift();
  if(e.t===6){ wdAward('MOTHER_LODE'); spawnEnemy(0,e.x-18,e.y); spawnEnemy(0,e.x+18,e.y); }
}
function hurtPlayer(){
  if(P.ifr>0||mode!=='play') return;
  P.ifr=S.ifr; regenT=0; shake=mn(shake+9,18); flashT=0.3; flashC='#fff'; sHurt();
  freeze=mx(freeze,0.1); ring(P.x,P.y,14,190,'#ff2d6f',0.38);
  wdHit=1;
  if(lit<=0){ mode='dead'; musOn&&musGain&&(musGain.gain.value=0.12); wdEnd(0); return; }
  var lost=slot[lit-1];
  say(P.x,P.y,'LOST '+UP[lost][0],'#ff3355',1.3);
  lit--; if(lit===1) wdAward('THIN_RED_LINE');
  recalc();
  burst(P.x,P.y,GRAY[0],22,220);
  if(lost===19||S.nova){ // supernova triggers on the way down
    shake=18; flashT=0.5; rainbowBurst(P.x,P.y,60);
    for(var i=ents.length-1;i>=0;i--){ var e=ents[i], d=hyp(e.x-P.x,e.y-P.y);
      if(d<300) hurtEnemy(e,32,(e.x-P.x)/d*40,(e.y-P.y)/d*40); }
    if(boss&&hyp(boss.x-P.x,boss.y-P.y)<340) hurtBoss(32);
    snd(70,0.6,'sawtooth',0.14,0.2); }
}

// ---------- boss ----------
function spawnBoss(){
  boss={x:mx(300,mn(AW-300,P.x)),y:mx(200,mn(AH-200,P.y-340)),hp:7*46,mhp:7*46,r:58,fl:0,phase:0,pt:0,mode:0,spawnCd:2,bob:0,vx:0,vy:0,dash:0};
  bossWarn=2.6; snd(60,1.2,'sawtooth',0.16,0.25);
}
function hurtBoss(d){
  boss.hp-=d; boss.fl=0.12;
  var np=7-Math.ceil(boss.hp/46);
  if(np>boss.phase){ boss.phase=np; boss.mode=(boss.mode+1)%3; boss.pt=0;
    rainbowBurst(boss.x,boss.y,40); shake=14; freeze=mx(freeze,0.16);
    ring(boss.x,boss.y,40,420,BAND[6-np+1]||'#fff',0.6); snd(200,0.5,'square',0.1,0.3); }
  if(boss.hp<=0){ rainbowBurst(boss.x,boss.y,120); shake=20; boss=null; mode='win'; wdEnd(1); }
}

// ---------- update ----------
function update(dt){
  if(shake>0){ shake-=dt*26; if(shake<0) shake=0; }
  if(flashT>0) flashT-=dt;
  if(xpFl>0) xpFl-=dt;
  if(mode!=='play'){ updParts(dt); return; }
  T+=dt; P.bob+=dt;

  // ---- movement ----
  var mvx=0,mvy=0,mag=1;
  if(isTouch&&stick.on&&stick.mag>0.14){ var d=hyp(stick.dx,stick.dy)||1; mvx=stick.dx/d; mvy=stick.dy/d; mag=stick.mag; }
  else { if(keys.w||keys.z||keys.arrowup) mvy--; if(keys.s||keys.arrowdown) mvy++;
    if(keys.a||keys.q||keys.arrowleft) mvx--; if(keys.d||keys.arrowright) mvx++;
    var dd=hyp(mvx,mvy); if(dd){ mvx/=dd; mvy/=dd; } }
  P.vx=mvx*S.spd*mag; P.vy=mvy*S.spd*mag;
  P.x+=mvx*S.spd*mag*dt; P.y+=mvy*S.spd*mag*dt;
  // trainee de couleur quand tu cours
  if((mvx||mvy)&&rnd()<0.55) parts.push({x:P.x+rr(-6,6),y:P.y+10,vx:rr(-16,16),
    vy:rr(-24,4),l:0.34,c:BAND[ri(mx(1,lit))],s:3});
  P.x=mx(20,mn(AW-20,P.x)); P.y=mx(20,mn(AH-20,P.y));

  // ---- visee automatique: le joueur ne fait que se deplacer ----
  var tg=nearest(P.x,P.y,9e9)||boss;
  if(tg) P.ang=atan(tg.y-P.y,tg.x-P.x);
  P.face=cos(P.ang)<0?-1:1;

  // ---- tir: seulement s'il y a quelque chose a portee de plomb ----
  P.fireCd-=dt;
  if(P.fireCd<=0){ var FR=620*S.rng*1.06;
    if(nearest(P.x,P.y,FR)||(boss&&hyp(boss.x-P.x,boss.y-P.y)<FR+boss.r)){
      P.fireCd=S.cd; fire(); } }

  // ---- invuln + repaint ----
  if(P.ifr>0) P.ifr-=dt;
  if(lit<lvl){ regenT+=dt; if(regenT>=S.regen){ regenT=0; lit++; wdAward('PAINT_IT_BACK'); recalc(); sPaint();
    burst(P.x,P.y,BAND[lit-1],18,190);
    // la bande revient: l'ecran prend sa couleur un instant
    flashT=0.28; flashC=BAND[lit-1];
    ring(P.x,P.y,12,240,BAND[lit-1],0.45); say(P.x,P.y,UP[slot[lit-1]][0]+' BACK',BAND[lit-1],1.2);
  } } else regenT=0;

  // ---- passive powers ----
  if(S.orb) orbA+=dt*3.4;
  if(S.rain){ rainT-=dt; if(rainT<=0){ rainT=1.05;
    for(var i=ents.length-1;i>=0;i--){ var e=ents[i]; if(hyp(e.x-P.x,e.y-P.y)<165) hurtEnemy(e,4.5); }
    if(boss&&hyp(boss.x-P.x,boss.y-P.y)<200) hurtBoss(4.5);
    for(var k=0;k<14;k++){ var a=rnd()*TAU, rd=rnd()*165;
      parts.push({x:P.x+cos(a)*rd,y:P.y+sin(a)*rd-30,vx:0,vy:280,l:0.25,c:'#8fd8ff',s:2}); }
    snd(600,0.14,'sine',0.03,0.4); } }
  if(S.storm){ if(!storm) storm={x:P.x,y:P.y};
    storm.x+=(P.x-storm.x)*mn(1,dt*2.4); storm.y+=(P.y-60-storm.y)*mn(1,dt*2.4);
    stormT-=dt; if(stormT<=0){ stormT=0.75; var tgt=nearest(storm.x,storm.y,300);
      if(tgt){ hurtEnemy(tgt,9); zaps.push({x1:storm.x,y1:storm.y,x2:tgt.x,y2:tgt.y,l:0.14});
        snd(1400,0.08,'sawtooth',0.05,0.2); }
      else if(boss&&hyp(boss.x-storm.x,boss.y-storm.y)<340){ hurtBoss(9);
        zaps.push({x1:storm.x,y1:storm.y,x2:boss.x,y2:boss.y,l:0.14}); } } }
  if(S.lure){ if(!mirage||mirage.l<=0){ if(!mirage) mirage={l:0};
      mirage.l-=dt; if(mirage.l<=0){ mirage.x=P.x+rr(-130,130); mirage.y=P.y+rr(-130,130); mirage.l=5.5;
        mirage.x=mx(30,mn(AW-30,mirage.x)); mirage.y=mx(30,mn(AH-30,mirage.y)); } }
    else mirage.l-=dt; }

  // ---- spawning ----
  if(!boss&&bossSpawnT<=0){
    spawnT-=dt;
    if(spawnT<=0&&ents.length<60){ spawnT=mx(0.4,0.85-T*0.009);
      spawnEnemy(pickType());
      if(T>50&&rnd()<0.35) spawnEnemy(pickType()); }
  }
  if(bossSpawnT>0){ bossSpawnT-=dt; if(bossSpawnT<=0) spawnBoss(); }
  if(bossWarn>0) bossWarn-=dt;

  for(var ri2=rings.length-1;ri2>=0;ri2--){ rings[ri2].l-=dt;
    if(rings[ri2].l<=0) rings.splice(ri2,1); }
  for(var ti=texts.length-1;ti>=0;ti--){ texts[ti].l-=dt*1.6;
    if(texts[ti].l<=0) texts.splice(ti,1); }
  for(var pi=pops.length-1;pi>=0;pi--){ pops[pi].l-=dt;
    if(pops[pi].l<=0) pops.splice(pi,1); }
  for(var si=stars.length-1;si>=0;si--){ var sr=stars[si];
    sr.l-=dt; sr.x+=sr.vx*dt; sr.y+=sr.vy*dt; sr.vx*=0.93; sr.vy*=0.93;
    sr.rot+=dt*6; if(sr.l<=0) stars.splice(si,1); }
  for(var gi=gibs.length-1;gi>=0;gi--){ var gb=gibs[gi];
    gb.l-=dt; gb.x+=gb.vx*dt; gb.y+=gb.vy*dt; gb.rot+=gb.vr*dt;
    gb.z+=gb.vz*dt; gb.vz-=1100*dt;           // saut vertical puis rebond au sol
    if(gb.z<0){ gb.z=0; gb.vz*=-0.42; gb.vx*=0.72; gb.vy*=0.72; gb.vr*=0.6; }
    if(gb.l<=0) gibs.splice(gi,1); }
  updEnemies(dt); updShots(dt); updHearts(dt); updDrops(dt); updParts(dt); updBoss(dt);
}

function nearest(x,y,maxD){ var best=null,bd=maxD*maxD;
  for(var i=0;i<ents.length;i++){ var e=ents[i], dx=e.x-x, dy=e.y-y, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=e; } } return best; }

function fire(){
  var n=S.pel, base=P.ang;
  for(var i=0;i<n;i++){
    var a=base+rr(-S.spr,S.spr)/2+ (i-(n-1)/2)*S.spr/n,
        sp=620*rr(0.85,1.15);
    shots.push({x:P.x+cos(base)*20,y:P.y+sin(base)*20,vx:cos(a)*sp,vy:sin(a)*sp,
      l:S.rng*rr(0.85,1.1),d:S.dmg,hit:[],split:S.refr?1:0,c:BAND[i%7]});
  }
  // muzzle
  for(var k=0;k<9;k++){ var a2=base+rr(-0.4,0.4);
    parts.push({x:P.x+cos(base)*22,y:P.y+sin(base)*22,vx:cos(a2)*rr(160,420),vy:sin(a2)*rr(160,420),l:0.14,c:'#fff6d0',s:3}); }
  parts.push({x:P.x,y:P.y,vx:cos(base+1.9)*rr(90,180),vy:sin(base+1.9)*rr(90,180),
    l:0.45,c:'#ffd257',s:2});
  shake=mn(shake+1.5,9); sShoot();
  P.x-=cos(base)*4; P.y-=sin(base)*4;
}

function updShots(dt){
  for(var i=shots.length-1;i>=0;i--){ var s=shots[i];
    s.l-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.l<=0||s.x<camX-40||s.x>camX+W+40||s.y<camY-40||s.y>camY+H+40){ shots.splice(i,1); continue; }
    var done=false;
    for(var j=0;j<ents.length;j++){ var e=ents[j];
      if(s.hit.indexOf(e)>=0) continue;
      if(hyp(e.x-s.x,e.y-s.y)<e.r+5){
        var d=atan(s.vy,s.vx);
        hurtEnemy(e,s.d,cos(d)*S.knock*dt*8,sin(d)*S.knock*dt*8,1);
        burst(s.x,s.y,s.c,4,130);
        if(S.arc){ var t2=null,bd=140*140;
          for(var m=0;m<ents.length;m++){ var o=ents[m]; if(o===e) continue;
            var dd2=(o.x-e.x)*(o.x-e.x)+(o.y-e.y)*(o.y-e.y); if(dd2<bd){ bd=dd2; t2=o; } }
          if(t2){ hurtEnemy(t2,s.d*0.5,0,0,1); zaps.push({x1:e.x,y1:e.y,x2:t2.x,y2:t2.y,l:0.1}); } }
        if(s.split){ for(var q=-1;q<2;q+=2){ var na=d+q*0.7;
            shots.push({x:s.x,y:s.y,vx:cos(na)*520,vy:sin(na)*520,l:0.16,d:s.d*0.5,hit:[e],split:0,c:s.c}); } }
        s.hit.push(e);
        if(!S.prism){ shots.splice(i,1); done=true; }
        break; } }
    if(done) continue;
    if(boss&&hyp(boss.x-s.x,boss.y-s.y)<boss.r&&s.hit.indexOf(boss)<0){
      hurtBoss(s.d); burst(s.x,s.y,s.c,5,150); s.hit.push(boss);
      if(!S.prism) shots.splice(i,1); }
  }
  for(var z=zaps.length-1;z>=0;z--){ zaps[z].l-=dt; if(zaps[z].l<=0) zaps.splice(z,1); }
}

function updEnemies(dt){
  for(var i=ents.length-1;i>=0;i--){
    // deux licornes peuvent mourir dans la meme iteration (ARC, HALO,
    // SUPERNOVA): le tableau raccourcit plus vite que l'indice.
    var e=ents[i]; if(!e) continue;
    var t=ET[e.t];
    // semee trop loin derriere, elle renonce
    if(Math.abs(e.x-P.x)>2400||Math.abs(e.y-P.y)>2400){ ents.splice(i,1); continue; }
    if(e.fl>0) e.fl-=dt;
    if(e.burn>0){ e.burn-=dt; e.hp-=6*dt;
      if(rnd()<0.4) parts.push({x:e.x+rr(-8,8),y:e.y+rr(-8,8),vx:0,vy:-60,l:0.3,c:'#ff8a1f',s:3});
      if(e.hp<=0){ killEnemy(e); continue; } }
    if(e.slow>0) e.slow-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    e.bob+=dt*9;
    var pd=hyp(e.x-P.x,e.y-P.y);
    if(S.tow&&pd<230) e.slow=mx(e.slow,0.12);        // UNDERTOW
    if(S.halo&&pd<150){ hurtEnemy(e,34*dt);          // HALO
      if(rnd()<dt*7) parts.push({x:e.x,y:e.y,vx:0,vy:-50,l:0.3,c:'#c9a8ff',s:3});
      if(e.hp<=0){ killEnemy(e); continue; } }

    // target: the mirage decoy steals aggro
    var tx=P.x+P.vx*e.ld, ty=P.y+P.vy*e.ld;
    if(mirage&&mirage.l>0&&hyp(mirage.x-e.x,mirage.y-e.y)<330){ tx=mirage.x; ty=mirage.y; }
    var dx=tx-e.x, dy=ty-e.y;
    // on fait tourner le vecteur: la distance reste juste, seul le cap devie
    e.wb+=e.ws*dt;
    var wa=sin(e.wb)*e.wq, cw=cos(wa), sw=sin(wa), oxd=dx;
    dx=dx*cw-dy*sw; dy=oxd*sw+dy*cw;
    var d=hyp(dx,dy)||1, sp=e.spd*(e.slow>0?0.35:1);
    e.face=dx<0?-1:1;

    if(e.t===3){ // rearer: pause, rear up, then charge
      e.cd-=dt;
      if(e.st===0){ e.x+=dx/d*sp*dt; e.y+=dy/d*sp*dt;
        if(e.cd<=0&&d<330){ e.st=1; e.cd=0.65; } }
      else if(e.st===1){ if(e.cd<=0){ e.st=2; e.cd=0.85; e.cx=dx/d; e.cy=dy/d; snd(300,0.2,'square',0.05); } }
      else { e.x+=e.cx*sp*4.6*dt; e.y+=e.cy*sp*4.6*dt; if(e.cd<=0){ e.st=0; e.cd=rr(1.4,2.6); } }
    } else if(e.t===4){ // spitter: keeps range, throws hearts
      var want=250;
      if(d>want+30){ e.x+=dx/d*sp*dt; e.y+=dy/d*sp*dt; }
      else if(d<want-40){ e.x-=dx/d*sp*dt; e.y-=dy/d*sp*dt; }
      e.cd-=dt;
      if(e.cd<=0&&d<400){ e.cd=rr(1.5,2.6);
        for(var h=-1;h<2;h++){ var a=atan(dy,dx)+h*0.22;
          hearts.push({x:e.x,y:e.y,vx:cos(a)*185,vy:sin(a)*185,l:4}); }
        snd(520,0.12,'sine',0.04); }
    } else if(e.t===5){ // blinker: teleports toward you
      e.cd-=dt;
      e.x+=dx/d*sp*0.45*dt; e.y+=dy/d*sp*0.45*dt;
      if(e.cd<=0){ e.cd=rr(1.6,2.8);
        burst(e.x,e.y,'#ff3fd0',12,150);
        var na=atan(dy,dx)+rr(-0.7,0.7), nd=mx(60,d-190);
        e.x=tx-cos(na)*nd; e.y=ty-sin(na)*nd;
        burst(e.x,e.y,'#ff3fd0',12,150); snd(900,0.08,'sine',0.03,0.3); }
    } else { e.x+=dx/d*sp*dt; e.y+=dy/d*sp*dt; }

    // orbiting horn
    if(S.orb&&e.orbCd<=0){ var ox=P.x+cos(orbA)*68, oy=P.y+sin(orbA)*68;
      if(hyp(e.x-ox,e.y-oy)<e.r+12){ e.orbCd=0.35; hurtEnemy(e,7,cos(orbA)*10,sin(orbA)*10);
        burst(ox,oy,'#ffd94a',6,160); if(e.hp<=0) continue; } }
    if(e.orbCd>0) e.orbCd-=dt;

    // separation so the herd does not stack into one pixel
    for(var j=i-1;j>=0&&j>i-6;j--){ var o=ents[j], ddx=o.x-e.x, ddy=o.y-e.y, dd=hyp(ddx,ddy);
      if(dd>0.1&&dd<e.r+o.r){ var push=(e.r+o.r-dd)*0.5; e.x-=ddx/dd*push; o.x+=ddx/dd*push;
        e.y-=ddy/dd*push; o.y+=ddy/dd*push; } }

    // contact
    if(hyp(e.x-P.x,e.y-P.y)<e.r+P.r){
      if(S.thorn){ hurtEnemy(e,14); burst(e.x,e.y,'#7de24a',6,150); }
      if(S.bubble){ var bd=atan(e.y-P.y,e.x-P.x); e.x+=cos(bd)*46; e.y+=sin(bd)*46;
        hurtEnemy(e,6); burst(e.x,e.y,'#8fd8ff',8,180); }
      else hurtPlayer();
    }
  }
}

function updHearts(dt){
  for(var i=hearts.length-1;i>=0;i--){ var h=hearts[i];
    h.l-=dt; h.x+=h.vx*dt; h.y+=h.vy*dt;
    if(h.l<=0||h.x<camX-30||h.x>camX+W+30||h.y<camY-30||h.y>camY+H+30){ hearts.splice(i,1); continue; }
    if(hyp(h.x-P.x,h.y-P.y)<P.r+7){ hearts.splice(i,1); if(S.bubble) continue; hurtPlayer(); } }
}

function updDrops(dt){
  for(var i=drops.length-1;i>=0;i--){ var d=drops[i];
    d.l-=dt; var dx=P.x-d.x, dy=P.y-d.y, dd=hyp(dx,dy)||1;
    if(dd<S.mag){ var pull=mn(700,90+ (S.mag-dd)*9); d.vx+=dx/dd*pull*dt; d.vy+=dy/dd*pull*dt; }
    d.x+=d.vx*dt; d.y+=d.vy*dt; d.vx*=0.94; d.vy*=0.94;
    if(dd<20){ drops.splice(i,1); gainXp(1); burst(d.x,d.y,d.c,4,110); continue; }
    if(d.l<=0) drops.splice(i,1); }
}
function gainXp(n){
  xp+=n; sPick(); xpFl=0.16;
  parts.push({x:P.x,y:P.y-18,vx:0,vy:-50,l:0.3,c:'#fff',s:2});
  if(lvl<7&&xp>=need) levelUp();
}

function updParts(dt){
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
    p.l-=dt; if(p.l<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; }
}

function updBoss(dt){
  if(!boss) return;
  var b=boss; b.bob+=dt*3;
  if(b.fl>0) b.fl-=dt;
  b.pt+=dt;
  var dx=P.x-b.x, dy=P.y-b.y, d=hyp(dx,dy)||1;
  if(b.y<110){ b.y+=90*dt; }
  else if(b.mode===0){ b.x+=dx/d*66*dt; b.y+=dy/d*66*dt; }
  else if(b.mode===1){ b.x+=dx/d*30*dt; b.y+=dy/d*30*dt;
    if(b.pt>1.7){ b.pt=0; var n=10+b.phase*2;
      for(var i=0;i<n;i++){ var a=i/n*TAU+rnd()*0.2;
        hearts.push({x:b.x,y:b.y,vx:cos(a)*165,vy:sin(a)*165,l:5}); }
      snd(420,0.3,'sine',0.07,0.4); } }
  else { if(b.dash>0){ b.dash-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt; }
    else if(b.pt>1.5){ b.pt=0; b.dash=0.65; b.vx=dx/d*470; b.vy=dy/d*470; snd(180,0.4,'sawtooth',0.09); } }
  b.x=mx(70,mn(AW-70,b.x)); b.y=mx(70,mn(AH-70,b.y));
  b.spawnCd-=dt;
  if(b.spawnCd<=0){ b.spawnCd=mx(1.1,2.8-b.phase*0.25);
    spawnEnemy(ri(mn(7,2+b.phase)),b.x+rr(-60,60),b.y+40); }
  if(hyp(b.x-P.x,b.y-P.y)<b.r+P.r) hurtPlayer();
}

// ---------- rendering ----------
// Pierres et arbres, semes une fois pour toutes par un generateur a graine
// fixe: memes positions a chaque partie, et zero octet de stockage.
// Pure decoration, ils n'arretent ni le heros ni les licornes.
var PROPS=(function(){ var r=mulb(77), a=[], i;
  for(i=0;i<700;i++){ var t=r();
    a.push([r()*AW,r()*AH,t<0.62?2:t<0.81?1:0,0.6+r()*0.85]); }
  return a; })();
// back=1: avant les personnages. back=0: apres, donc devant eux.
// Seuls les arbres se trient en profondeur, l'herbe et les pierres
// restent toujours au sol.
function drawProps(back){
  // On compare les points de CONTACT AU SOL, pas les ancres: les pieds du
  // heros sont 36 unites sous son ancre, le pied du tronc 6 sous la sienne.
  var gy=P.y+21;
  for(var i=0;i<PROPS.length;i++){ var p=PROPS[i], k=p[2], tg=p[1]+p[3]*6;
    if(p[0]<camX-70||p[0]>camX+W+70||p[1]<camY-90||p[1]>camY+H+70) continue;
    if(back ? (k===1&&tg>=gy) : (k!==1||tg<gy)) continue;
    V=X; X.save(); X.translate(p[0],p[1]); X.scale(p[3],p[3]);
    if(k===2){                                         // une touffe d'herbe
      X.lineCap='round'; X.lineWidth=2.6; X.strokeStyle='#356b48'; X.beginPath();
      for(var j=-2;j<3;j++){ X.moveTo(j*3.4,3); X.quadraticCurveTo(j*4,-3,j*5+1,-9); }
      X.stroke();
      X.lineWidth=1.3; X.strokeStyle='#63b078'; X.stroke();
      X.restore(); continue; }
    el(0,3,19,6,'rgba(0,0,0,0.26)');                   // l'ombre au sol
    if(k){                                             // un arbre
      rct(-5,-19,10,25,4,'#6b4a2e');
      el(0,-33,21,18,'#2f6b48'); el(-10,-25,13,11,'#3d8a5e');
      el(10,-27,11,10,'#3d8a5e'); el(-4,-39,9,8,'#59ab7a');
    } else {                                           // une pierre
      el(0,-1,17,12,'#7d8a86'); el(-4,-5,11,8,'#9aa8a3'); el(6,2,7,5,'#5e6b68');
    }
    X.restore(); }
}
function drawGrid(){
  X.fillStyle=BG; X.fillRect(camX-60,camY-60,W+120,H+120);
  for(var i=0;i<puds.length;i++){ var p=puds[i], z=1+p.s*0.24;
    V=X; X.save(); X.translate(p.x,p.y+6); X.scale(z,z);
    el(0,0,16,8,'#48173a'); el(-8,-3,8,5,'#48173a'); el(9,3,6,4,'#48173a');
    el(-3,-1,5,2,'#5e2049'); X.restore(); }
}


// the hero: an arch of 7 bands, angry face, oversized shotgun
function drawHero(x,y){
  var sp=heroSpr(lit,lvl), w=sp.width, h=sp.height, bob=sin(P.bob*7)*1.6;
  var up=sin(P.ang)<0, rc2=P.fireCd>S.cd-0.09?(P.fireCd-(S.cd-0.09))*40:0;
  X.save(); X.translate(x,y+bob); X.scale(1+rc2*0.14,1-rc2*0.12);
  X.fillStyle='rgba(0,0,0,0.35)'; X.beginPath(); X.ellipse(0,h/2-3,22,5,0,0,TAU); X.fill();
  if(up) gun();
  X.drawImage(sp,-w/2,-h/2);
  if(P.ifr>0&&(T*22|0)%2){ X.save(); X.globalCompositeOperation='lighter';
    X.globalAlpha=0.8; X.drawImage(sp,-w/2,-h/2); X.restore(); }
  if(!up) gun();
  X.restore();
  function gun(){
    var k=P.fireCd>S.cd-0.09?(P.fireCd-(S.cd-0.09))*40:0;
    X.save(); X.rotate(P.ang); X.translate(4-k,2);
    if(cos(P.ang)<0) X.scale(1,-1);
    X.drawImage(GUNS,0,-GUNS.height/2);
    if(k>0){ X.globalCompositeOperation='lighter';
      X.fillStyle='#ff9a3d'; X.beginPath();       // une gerbe courte, rien de plus
      X.moveTo(42,0); X.lineTo(60,-11); X.lineTo(74,0); X.lineTo(60,11); X.closePath(); X.fill();
      X.fillStyle='#fff3c0'; X.beginPath(); X.arc(48,0,7,0,TAU); X.fill();
      X.fillStyle='#fff'; X.beginPath(); X.arc(45,0,3.5,0,TAU); X.fill(); }
    X.restore(); }
}

function drawEnemy(e){
  var s=eSpr[e.t], k=eScl[e.t], w=s.width*k, h=s.height*k, bo=sin(e.bob)*2;
  X.save(); X.translate(e.x,e.y+bo);
  X.fillStyle='rgba(0,0,0,0.3)'; X.beginPath(); X.ellipse(0,h/2-2-bo,w*0.3,4,0,0,TAU); X.fill();
  if(e.t===3&&e.st===1) X.rotate(-0.45*e.face);
  var sq=1+e.fl*2.4;                       // ecrasement a l'impact
  X.scale(e.face*sq,1/sq);
  X.drawImage(s,-w/2,-h/2,w,h);
  X.restore();
  if(e.sh){ X.save(); X.globalCompositeOperation='lighter'; X.globalAlpha=0.5+sin(T*9)*0.2;
    X.strokeStyle='#9df5e6'; X.lineWidth=2; X.beginPath(); X.arc(e.x,e.y,e.r+6,0,TAU); X.stroke(); X.restore(); }
  if(e.slow>0){ X.save(); X.globalAlpha=0.4; X.fillStyle='#8fd8ff';
    X.beginPath(); X.arc(e.x,e.y,e.r+3,0,TAU); X.fill(); X.restore(); }
  if(e.fl>0){ X.save(); X.globalCompositeOperation='lighter';
    X.fillStyle='rgba(255,255,255,'+mn(1,e.fl*5)+')';
    X.beginPath(); X.arc(e.x,e.y,e.r,0,TAU); X.fill(); X.restore(); }
}

function drawHeart(x,y,s,col){
  X.fillStyle=col; X.beginPath();
  X.moveTo(x,y+s*0.7);
  X.bezierCurveTo(x-s*1.4,y-s*0.4,x-s*0.5,y-s*1.2,x,y-s*0.4);
  X.bezierCurveTo(x+s*0.5,y-s*1.2,x+s*1.4,y-s*0.4,x,y+s*0.7);
  X.fill();
}

function drawBoss(){
  var b=boss, bo=sin(b.bob)*4, i, h;
  X.save(); X.translate(b.x,b.y+bo);

  // les meches volees jaillissent du centre, une par phase restante
  X.save(); X.globalCompositeOperation='lighter';
  X.lineWidth=10; X.lineCap='round';
  for(i=6;i>=0;i--){ if(i<b.phase) continue;
    var a2=-1.6+i*0.42;
    X.strokeStyle=BAND[i]; X.beginPath(); X.moveTo(0,-6);
    X.quadraticCurveTo(cos(a2)*46,-92+sin(b.bob*2+i)*12,cos(a2)*96,-32+sin(a2)*96);
    X.stroke(); }
  X.restore();

  // quatre cous serpentins qui ondulent, retombent quand la tete meurt
  var hp=[[-1,.5],[-.42,-.2],[.42,-.2],[1,.5]];
  for(h=0;h<4;h++){
    var p=hp[h], dead=h>=4-Math.ceil(b.phase*4/7),
        w=dead?0:sin(b.bob*2.4+h*1.6)*20,
        ex=p[0]*(dead?102:92)+w*0.2, ey=(dead?66:p[1]*92-14)+w*0.3;
    for(i=0;i<2;i++){
      X.strokeStyle=i?(h%2?'#d9a8f0':'#c48fe0'):'#2b1140';
      X.lineWidth=i?20:27; X.lineCap='round';
      X.beginPath(); X.moveTo(0,14);
      X.bezierCurveTo(p[0]*32,36+w,p[0]*104,ey+50,ex,ey+16); X.stroke(); }
    var hh=dead?bossQuiet:bossHead;
    X.save(); X.translate(ex,ey);
    X.rotate(dead?(p[0]<0?1.5:-1.5):(p[0]<0?.35:-.35));
    if(p[0]>0) X.scale(-1,1);
    X.scale(1.9,1.9); X.drawImage(hh,-hh.ox,-hh.oy); X.restore(); }

  // le coeur, compact et blinde
  X.fillStyle='#2b1140'; X.beginPath(); X.ellipse(0,20,54,44,0,0,TAU); X.fill();
  X.fillStyle='#c48fe0'; X.beginPath(); X.ellipse(0,20,50,40,0,0,TAU); X.fill();
  X.fillStyle='#d9a8f0'; X.beginPath(); X.ellipse(0,12,38,28,0,0,TAU); X.fill();
  X.fillStyle='#8fe8c8'; X.beginPath(); X.ellipse(-16,20,12,9,0,0,TAU); X.fill();
  X.restore();
}

function render(){
  X.setTransform(SC,0,0,SC,0,0);
  var sx=shake?rr(-shake,shake)|0:0, sy=shake?rr(-shake,shake)|0:0;
  if(mode==='title'){ camX=camY=0; X.save(); X.translate(sx,sy);
    drawTitle(); X.restore(); return; }
  camera();
  X.save(); X.translate(sx-camX,sy-camY);
  drawGrid(); drawProps(1);

  // halo doux sous le heros: le sol respire autour de toi
  var lgd=X.createRadialGradient(P.x,P.y,0,P.x,P.y,230);
  lgd.addColorStop(0,'rgba(255,210,255,0.10)'); lgd.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=lgd; X.fillRect(P.x-230,P.y-230,460,460);

  // drops
  X.save(); X.globalCompositeOperation='lighter';
  for(var i=0;i<drops.length;i++){ var d=drops[i], f=d.l<3?(sin(T*20)>0?0.3:1):1;
    X.globalAlpha=f; X.fillStyle=d.c;
    X.beginPath(); X.arc(d.x,d.y,4,0,TAU); X.fill();
    X.fillStyle='#fff'; X.beginPath(); X.arc(d.x,d.y,1.6,0,TAU); X.fill(); }
  X.restore();

  // mirage decoy
  if(mirage&&mirage.l>0){ X.save(); X.globalAlpha=0.45+sin(T*8)*0.15;
    for(var m=0;m<7;m++){ X.fillStyle=BAND[6-m]; X.fillRect(mirage.x-11,mirage.y-16+m*5,22,5); }
    X.restore(); }

  // enemies
  for(i=0;i<ents.length;i++) drawEnemy(ents[i]);
  if(boss) drawBoss();

  // hearts
  for(i=0;i<hearts.length;i++) drawHeart(hearts[i].x,hearts[i].y,8,'#ff4f92');

  // orbiting horn
  if(S.orb){ var ox=P.x+cos(orbA)*68, oy=P.y+sin(orbA)*68;
    X.save(); X.translate(ox,oy); X.rotate(orbA+PI/2);
    X.fillStyle='#ffd94a'; X.beginPath(); X.moveTo(0,-14); X.lineTo(6,10); X.lineTo(-6,10); X.closePath(); X.fill();
    X.fillStyle='#fff6c0'; X.fillRect(-2,-8,2,14); X.restore(); }

  // storm cloud
  if(S.storm&&storm){ X.save(); X.fillStyle='#5a4a7a';
    X.beginPath(); X.ellipse(storm.x,storm.y,30,14,0,0,TAU); X.fill();
    X.beginPath(); X.ellipse(storm.x-14,storm.y+4,18,11,0,0,TAU); X.fill();
    X.beginPath(); X.ellipse(storm.x+15,storm.y+3,17,10,0,0,TAU); X.fill(); X.restore(); }

  // zaps
  X.save(); X.globalCompositeOperation='lighter'; X.strokeStyle='#fff6a0'; X.lineWidth=3;
  for(i=0;i<zaps.length;i++){ var z=zaps[i]; X.globalAlpha=z.l*8;
    X.beginPath(); X.moveTo(z.x1,z.y1);
    X.lineTo((z.x1+z.x2)/2+rr(-12,12),(z.y1+z.y2)/2+rr(-12,12));
    X.lineTo(z.x2,z.y2); X.stroke(); }
  X.restore();

  // ondes de choc
  X.save(); X.globalCompositeOperation='lighter';
  for(i=0;i<rings.length;i++){ var rg=rings[i], kk=1-rg.l/rg.L;
    X.globalAlpha=(1-kk)*0.85; X.strokeStyle=rg.c; X.lineWidth=1+5*(1-kk);
    X.beginPath(); X.arc(rg.x,rg.y,rg.r+(rg.R-rg.r)*(1-(1-kk)*(1-kk)),0,TAU); X.stroke(); }
  X.restore();

  // pellets
  X.save(); X.globalCompositeOperation='lighter';
  for(i=0;i<shots.length;i++){ var s=shots[i];
    X.strokeStyle=s.c; X.lineWidth=4; X.beginPath();
    X.moveTo(s.x,s.y); X.lineTo(s.x-s.vx*0.016,s.y-s.vy*0.016); X.stroke();
    X.strokeStyle='#fff'; X.lineWidth=1.5; X.beginPath();
    X.moveTo(s.x,s.y); X.lineTo(s.x-s.vx*0.009,s.y-s.vy*0.009); X.stroke(); }
  X.restore();

  // le spectre des licornes qui viennent de mourir
  X.save(); X.globalCompositeOperation='lighter';
  for(i=0;i<pops.length;i++){ var po=pops[i], kp=1-po.l/po.L, es=eSpr[po.t],
      pw=es.width*eScl[po.t]*(1+kp*1.1), ph=es.height*eScl[po.t]*(1+kp*1.1);
    X.globalAlpha=(1-kp)*0.75;
    X.save(); X.translate(po.x,po.y); X.scale(po.f,1);
    X.drawImage(es,-pw/2,-ph/2,pw,ph); X.restore(); }
  X.restore();
  // les etoiles de la gerbe
  X.save(); X.globalCompositeOperation='lighter';
  for(i=0;i<stars.length;i++){ var sr=stars[i];
    X.globalAlpha=mn(1,sr.l*2.6);
    X.save(); X.translate(sr.x,sr.y); X.rotate(sr.rot);
    spark(0,0,sr.r,sr.c); X.restore(); }
  X.restore();

  // les tetes detachees, qui sourient encore
  for(i=0;i<gibs.length;i++){ var gb=gibs[i], hh=eHead[gb.t];
    X.save(); X.globalAlpha=mn(1,gb.l*2.2);
    X.translate(gb.x,gb.y-gb.z); X.rotate(gb.rot); X.scale(gb.k,gb.k);
    X.drawImage(hh,-hh.ox,-hh.oy); X.restore(); }
  X.globalAlpha=1;

  drawHero(P.x,P.y);
  drawProps(0);          // les arbres devant lesquels tu es passe
  for(i=0;i<texts.length;i++){ var tp=texts[i], b=1-tp.l, z=tp.z*Math.pow(sin(b*PI),0.5);
    X.save(); X.translate(tp.x+tp.dx*b,tp.y-18-34*b); X.rotate(b*tp.r); X.scale(z,z);
    otext(tp.t,0,0,15,tp.c,1); X.restore(); }

  // particles
  X.save(); X.globalCompositeOperation='lighter';
  for(i=0;i<parts.length;i++){ var p=parts[i];
    X.globalAlpha=mn(1,p.l*3.5); X.fillStyle=p.c;
    X.beginPath(); X.arc(p.x,p.y,p.s*0.8,0,TAU); X.fill(); }
  X.restore();

  // vignette
  X.restore();                       // fin du repere monde

  // calques plein ecran: ils ne doivent PAS suivre la camera
  var vg=X.createRadialGradient(W/2,H/2,mn(W,H)*0.35,W/2,H/2,mx(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(9,28,18,0.72)');
  X.fillStyle=vg; X.fillRect(0,0,W,H);
  if(lit<=1&&mode==='play'){ X.fillStyle='rgba(255,40,90,'+(0.05+0.07*Math.abs(sin(T*7)))+')';
    X.fillRect(0,0,W,H); }
  if(flashT>0){ X.globalAlpha=flashT*0.55; X.fillStyle=flashC; X.fillRect(0,0,W,H); X.globalAlpha=1; }

  hud();
  if(mode==='up') drawCards();
  if(mode==='dead') endScreen('YOU FADED','the herd is still laughing');
  if(mode==='win') endScreen('YOU GOT YOUR COLOURS BACK','nobody is laughing now');
  if(bossWarn>0&&mode==='play'){ X.fillStyle='rgba(255,60,120,'+(0.4+sin(T*18)*0.3)+')';
    X.font='bold '+mn(46,W/12)+'px monospace'; X.textAlign='center';
    X.fillText('IT IS COMING',W/2,H/2-60); }
  // le bandeau de trophee passe apres l'ecran de fin: sinon les trophees de
  // victoire seraient recouverts a la frame meme ou ils tombent
  if(wdBq.length){ X.globalAlpha=mn(1,wdBl*1.6);
    otext(wdBq[0],W/2,46,19,'#ffd42e',1); X.globalAlpha=1; X.textAlign='left'; }
}

// ---------- hud ----------
function hud(){
  // the band stack, mirroring the hero
  var bx=16, by=16, bw=88, bh=13;
  for(var i=0;i<7;i++){
    var bi=6-i;
    X.fillStyle= bi<lit ? BAND[bi] : (bi<lvl ? GRAY[bi] : 'rgba(255,255,255,0.06)');
    X.fillRect(bx,by+i*(bh+3),bw,bh);
    if(bi===lit-1){ X.fillStyle='rgba(255,255,255,'+(0.3+0.4*Math.abs(sin(T*5)))+')';
      X.fillRect(bx,by+i*(bh+3),bw,2.5); }
    if(bi<lit&&slot[bi]>=0){ X.fillStyle='rgba(0,0,0,0.75)'; X.font='bold 9px monospace'; X.textAlign='left';
      X.fillText(UP[slot[bi]][0],bx+5,by+i*(bh+3)+10); }
    else if(bi<lvl&&slot[bi]>=0){ X.fillStyle='rgba(255,255,255,0.35)'; X.font='bold 9px monospace'; X.textAlign='left';
      X.fillText(UP[slot[bi]][0],bx+5,by+i*(bh+3)+10); } }
  // repaint timer
  if(lit<lvl){ X.fillStyle='rgba(255,255,255,0.75)';
    X.fillRect(bx,by+7*(bh+3)+2,bw*mn(1,regenT/S.regen),3); }
  // xp bar
  var xw=mn(W-32,300);
  X.fillStyle='rgba(255,255,255,'+(0.12+xpFl*2)+')'; X.fillRect(W/2-xw/2,H-22,xw,10);
  if(lvl<7){ X.fillStyle=BAND[mn(6,lvl)]; X.fillRect(W/2-xw/2,H-22,xw*mn(1,xp/need),10); }
  else { X.fillStyle='#fff'; X.fillRect(W/2-xw/2,H-22,xw,10); }
  otext(lvl<7?('BAND '+(lvl+1)+' : '+FAM[lvl]):'FULL SPECTRUM',W/2,H-28,13,'#fff',1);
  X.textAlign='right'; X.font='bold 14px monospace';
  X.lineWidth=3; X.strokeStyle=OUT; X.strokeText(kills+' kills',W-14,28);
  X.fillStyle='#fff'; X.fillText(kills+' kills',W-14,28);
  X.textAlign='left';
  // carte reduite: le monde, les licornes, et ou tu te trouves dedans
  var mw=mn(96,W*0.16), mh=mw*AH/AW, m0=W-mw-14, n0=48;
  X.globalAlpha=0.72; X.fillStyle='#0d0518'; X.fillRect(m0,n0,mw,mh);
  X.globalAlpha=1; X.strokeStyle='#5e2b8a'; X.lineWidth=1;
  X.strokeRect(m0+0.5,n0+0.5,mw,mh);
  for(i=0;i<ents.length;i++){ X.fillStyle=ET[ents[i].t][3];
    X.fillRect(m0+ents[i].x/AW*mw-1,n0+ents[i].y/AH*mh-1,2,2); }
  if(boss){ X.fillStyle='#ffd42e'; X.fillRect(m0+boss.x/AW*mw-3,n0+boss.y/AH*mh-3,6,6); }
  X.strokeStyle='rgba(255,255,255,0.35)';
  X.strokeRect(m0+camX/AW*mw,n0+camY/AH*mh,W/AW*mw,H/AH*mh);
  X.fillStyle='#fff'; X.fillRect(m0+P.x/AW*mw-2,n0+P.y/AH*mh-2,4,4);

  // joystick virtuel
  if(isTouch){ X.save();
    if(!stick.on){                               // ou poser le pouce
      X.globalAlpha=0.10; X.strokeStyle='#fff'; X.lineWidth=3;
      X.beginPath(); X.arc(W*0.2,H-SMAX-30,SMAX,0,TAU); X.stroke();
      X.fillStyle='#fff'; X.beginPath(); X.arc(W*0.2,H-SMAX-30,26,0,TAU); X.fill(); }
    else { var jx=stick.ox+stick.dx, jy=stick.oy+stick.dy;
      X.globalAlpha=0.35; X.strokeStyle='#fff'; X.lineWidth=3;
      X.beginPath(); X.arc(stick.ox,stick.oy,SMAX,0,TAU); X.stroke();
      X.globalAlpha=0.8;
      var jg=X.createRadialGradient(jx,jy-8,2,jx,jy,29);
      jg.addColorStop(0,'#fff'); jg.addColorStop(1,BAND[mx(0,lit-1)]);
      X.fillStyle=jg; X.beginPath(); X.arc(jx,jy,28,0,TAU); X.fill(); }
    X.restore(); }
}

function cardRect(i){
  var cw=mn(W-40,420), ch=mn(84,(H-190)/3), gap=14,
      total=ch*3+gap*2, top=(H-total)/2+24;
  return [W/2-cw/2, top+i*(ch+gap), cw, ch];
}
function icon(x,y,r,k,c){
  X.save(); X.translate(x,y); X.fillStyle=c; X.strokeStyle=c;
  X.lineWidth=r*0.34; X.beginPath();
  if(k<1) X.arc(0,0,r*0.8,0,TAU);                                     // disque
  else if(k<2){ X.moveTo(0,-r); X.lineTo(r*0.9,r*0.7); X.lineTo(-r*0.9,r*0.7); }
  else if(k<3){ X.arc(0,0,r*0.7,0,TAU); X.stroke(); X.beginPath(); }  // anneau
  else if(k<4){ X.restore(); spark(x,y,r,c); return; }                // etincelle
  else if(k<5){ X.moveTo(r*0.35,-r); X.lineTo(-r*0.5,r*0.1); X.lineTo(0,r*0.1);
    X.lineTo(-r*0.35,r); X.lineTo(r*0.5,-r*0.1); X.lineTo(0,-r*0.1); }// eclair
  else if(k<6){ X.moveTo(0,-r); X.quadraticCurveTo(r*0.85,r*0.3,0,r*0.85);
    X.quadraticCurveTo(-r*0.85,r*0.3,0,-r); }                         // goutte
  else if(k<7){ X.moveTo(0,-r); X.lineTo(r*0.8,0); X.lineTo(0,r); X.lineTo(-r*0.8,0); }
  else { X.arc(0,0,r*0.72,0.7,4.9); X.stroke(); X.beginPath(); }      // croissant
  X.fill(); X.restore();
}
function drawCards(){
  dim=mn(1,dim+0.09);
  X.fillStyle='rgba(8,3,18,'+dim*0.82+')'; X.fillRect(0,0,W,H);
  X.textAlign='center'; X.fillStyle=BAND[lvl]; X.font='bold '+mn(30,W/14)+'px monospace';
  X.fillText('PAINT THE '+FAM[lvl]+' BAND',W/2,cardRect(0)[1]-30);
  for(var i=0;i<3;i++){
    var r=cardRect(i), u=cards[i];
    X.fillStyle='rgba(255,255,255,0.05)'; X.fillRect(r[0],r[1],r[2],r[3]);
    X.fillStyle=BAND[lvl]; X.fillRect(r[0],r[1],7,r[3]);
    X.strokeStyle=BAND[lvl]; X.lineWidth=2; X.strokeRect(r[0],r[1],r[2],r[3]);
    icon(r[0]+40,r[1]+r[3]/2,15,UP[u][2],BAND[lvl]);
    X.textAlign='left'; X.fillStyle=BAND[lvl]; X.font='bold 20px monospace';
    X.fillText(UP[u][0],r[0]+68,r[1]+34);
    X.fillStyle='rgba(255,255,255,0.72)'; X.font='13px monospace';
    X.fillText(UP[u][1],r[0]+68,r[1]+56);
  }
  X.textAlign='center'; X.fillStyle='rgba(255,255,255,0.4)'; X.font='12px monospace';
  X.fillText('a painted band is a weapon. lose it, lose the weapon.',W/2,cardRect(2)[1]+cardRect(2)[3]+28);
  X.textAlign='left';
}

function endScreen(t,sub){
  var w=mode==='win', m=mn(W,H), cx=W/2, cy=H/2, i, q;
  X.fillStyle=w?'rgba(10,4,24,0.8)':'rgba(6,2,12,0.9)'; X.fillRect(0,0,W,H);

  // la pluie de couleurs volees, quand tu les as reprises
  if(w) for(i=0;i<44;i++){ q=(T*130+i*151)%(H+70);
    X.globalAlpha=0.85; X.fillStyle=BAND[i%7];
    X.fillRect((i*179)%W,q-70,4,14); }
  X.globalAlpha=1;

  // toi, en grand: tout gris si tu as fondu, rallume si tu as gagne
  var hs=heroSpr(w?7:0,7,110), z=m*0.32/(110*2.06);
  X.save(); X.translate(cx,cy-m*0.19+(w?sin(T*2)*4:0)); X.scale(z,z);
  if(w){ X.shadowColor='#c04ff0'; X.shadowBlur=55; } else X.rotate(0.22);
  X.drawImage(hs,-hs.ox,-hs.oy); X.shadowBlur=0; X.restore();

  X.textAlign='center';
  X.fillStyle=w?'#ffd42e':'#8a8098';
  // la police suit la longueur du titre: sinon 'YOU GOT YOUR COLOURS BACK'
  // deborde de l'ecran en portrait
  X.font='bold '+(mn(38,W/(t.length*0.66))|0)+'px monospace'; X.fillText(t,cx,cy+m*0.06);
  X.fillStyle='rgba(255,255,255,0.5)'; X.font=(mn(14,W/28)|0)+'px monospace';
  X.fillText(sub,cx,cy+m*0.06+24);

  // les sept bandes: jusqu'ou tu es monte, et ce qu'il te restait
  var bw=mn(34,W/11);
  for(i=0;i<7;i++){ X.fillStyle=i<lit?BAND[i]:(i<lvl?GRAY[i]:'#241a38');
    X.fillRect(cx-bw*3.5+i*bw+1,cy+m*0.12,bw-3,10); }

  X.fillStyle='#fff'; X.font='bold '+(mn(16,W/24)|0)+'px monospace';
  X.fillText(kills+' unicorns    '+(T|0)+'s    band '+lvl+'/7',cx,cy+m*0.12+34);
  X.globalAlpha=0.4+0.3*sin(T*3.5); X.fillStyle='#fff';
  X.font=(mn(13,W/30)|0)+'px monospace';
  X.fillText(isTouch?'tap to go again':'click to go again',cx,cy+m*0.12+62);
  X.globalAlpha=1; X.textAlign='left';
}

// ---------- title ----------
// Quatre licornes se penchent des coins et te pointent du doigt en riant.
// Toi, au milieu, tu es minuscule et tu as les bras croises.
var HR=120;                                  // resolution des tetes du titre
var tHead=[mkHead('#a8ecdc','#6fc9b8','#ffb3e0','#c97fb0',1,HR),
           mkHead('#f5c4ff','#c08fd6','#a8e8dc','#6fb8c9',1,HR),
           mkHead('#d9b8ff','#a88fd6','#ffc4a8','#d69f7f',1,HR),
           mkHead('#ffe0b8','#d6b88f','#ffb3d9','#7fd6c9',1,HR)];
var STARS=(function(){ var r=mulb(11), a=[], i;
  for(i=0;i<110;i++) a.push([r(),r(),r()*2.2+0.7,r()]); return a; })();

// une etincelle a quatre branches
function spark(x,y,r,c){ X.fillStyle=c; X.beginPath();
  X.moveTo(x,y-r); X.quadraticCurveTo(x,y,x+r,y); X.quadraticCurveTo(x,y,x,y+r);
  X.quadraticCurveTo(x,y,x-r,y); X.quadraticCurveTo(x,y,x,y-r); X.fill(); }

// texte cerne de noir: lisible sur n'importe quel fond
function otext(t,x,y,fs,c,bold){
  X.font=(bold?'bold ':'')+(fs|0)+'px monospace'; X.textAlign='center';
  X.lineWidth=fs*0.22; X.lineJoin='round'; X.strokeStyle=OUT;
  X.strokeText(t,x,y); X.fillStyle=c; X.fillText(t,x,y);
}
// LE JURY: les quatre tetes en rang au sommet, penchees sur toi comme un
// tribunal, et un cone de lumiere qui ne tombe que sur toi, tout en bas.
function drawTitle(){
  var i, m=mn(W,H), cx=W/2;

  // la nuit et ses etoiles
  var g=X.createRadialGradient(cx,H/2,60,cx,H/2,mx(W,H)*0.85);
  g.addColorStop(0,'#241040'); g.addColorStop(1,'#12061f');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  for(i=0;i<STARS.length;i++){ var st=STARS[i];
    X.globalAlpha=0.25+0.6*Math.abs(sin(T*1.5+st[3]*9));
    X.fillStyle=st[3]<0.55?'#fff':'#e6a8ff';
    X.fillRect(st[0]*W,st[1]*H,st[2],st[2]); }
  X.globalAlpha=1;

  // le cone de lumiere
  X.save(); X.globalCompositeOperation='lighter';
  var lg=X.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'rgba(255,240,200,0.18)'); lg.addColorStop(1,'rgba(255,240,200,0)');
  X.fillStyle=lg; X.beginPath(); X.moveTo(cx-m*0.06,0); X.lineTo(cx+m*0.06,0);
  X.lineTo(cx+m*0.42,H); X.lineTo(cx-m*0.42,H); X.closePath(); X.fill(); X.restore();

  // le jury
  var hw=mn(W*0.22,H*0.16), k=hw/(HR*1.32);
  for(i=0;i<4;i++){ var hd=tHead[i], lg2=sin(T*7+i*1.7);
    X.save(); X.translate(W*(0.14+i*0.24),H*0.1+lg2*3); X.scale(i>1?-1:1,1);
    X.rotate(0.55+lg2*0.05); X.scale(k,k); X.drawImage(hd,-hd.ox,-hd.oy); X.restore(); }

  // toi, tout en bas, seul dans la lumiere
  var hs=heroSpr(7,7,150);
  // le titre: sept lettres cernees, chacune avec son halo
  var fs=mn(120,W/6.2,H*0.16)|0, y=H*0.1+hw*0.6+fs;
  X.font='bold '+fs+'px monospace'; X.textAlign='left';
  var ti='ROYGBIV', ox=cx-X.measureText(ti).width/2;
  for(i=0;i<7;i++){ var ch=ti.charAt(i), cw=X.measureText(ch).width;
    X.lineWidth=fs*0.16; X.lineJoin='round'; X.strokeStyle=OUT; X.strokeText(ch,ox,y);
    X.shadowColor=BAND[i]; X.shadowBlur=30; X.fillStyle=BAND[i];
    X.fillText(ch,ox,y); X.shadowBlur=0; ox+=cw; }

  var f=mn(26,W/16,H*0.045), l=f*1.35; y+=f*1.6;
  otext('EVERYONE LOVES UNICORNS.',cx,y,f,'#fff');
  otext('NOBODY WRITES A GOOD PART',cx,y+l,f,'#fff');
  otext('FOR THE RAINBOW.',cx,y+l*2,f,'#fff');
  otext('THAT CHANGES TONIGHT.',cx,y+l*3.3,f,'#ffd42e',1);

  // le heros prend la place qui reste entre le texte et l'invite
  var by=y+l*3.6, av=H-52-by, sc=mn(m*0.26/309,av/hs.height);
  X.save(); X.translate(cx,by+(av-hs.height*sc)/2+hs.oy*sc+sin(T*2)*3); X.scale(sc,sc);
  X.shadowColor='#ffe9a0'; X.shadowBlur=50;
  X.drawImage(hs,-hs.ox,-hs.oy); X.shadowBlur=0; X.restore();

  X.globalAlpha=0.55+0.45*sin(T*4);
  otext(isTouch?'TAP TO LOAD THE SHOTGUN':'CLICK TO LOAD THE SHOTGUN',cx,H-30,mn(24,W/22),'#fff',1);
  X.globalAlpha=1; X.textAlign='left';
}

// ---------- wavedash ----------
// Le global est injecte par la plateforme AVANT le code du jeu. Ailleurs il
// n'existe pas, et la garde rend le bloc inerte : sur js13kgames.com la partie
// se deroule exactement comme si ces lignes n'etaient pas la. Rien n'est
// telecharge, la regle "aucune ressource externe" tient.
// Sans init(), le jeu reste cache derriere l'ecran de chargement de Wavedash
// et n'apparait jamais.
// Un garde PAR appel : un try/catch partage ferait tomber ensemble des
// methodes independantes si l'une venait a disparaitre du SDK.
var WD=self.Wavedash, wdOk=0, wdQ=[], wdG={}, wdHit=0, wdBq=[], wdBl=0;
function wdCall(method,...args){ try{ var r=WD&&WD[method]&&WD[method](...args);
  return r&&r.then?r.catch(function(){}):r; }catch(e){} }
// setAchievement() ne fait rien tant que requestStats() n'a pas repondu : les
// trophees gagnes avant sont mis en attente, pas perdus.
function wdFlush(){ if(!wdOk) return;
  while(wdQ.length){ var i=wdQ[0];
    if(wdCall('getAchievement',i)!==true&&wdCall('setAchievement',i,true)!==true) return;
    wdQ.shift(); } }
// Le bandeau ne depend pas de la plateforme : il s'affiche aussi sur
// js13kgames.com, ou les votants sont. Le libelle se derive de l'identifiant,
// ce qui evite d'embarquer une table de titres.
function wdAward(i){ if(wdG[i]) return; wdG[i]=1;
  if(wdBq.push(i.replace(/_/g,' '))===1) wdBl=2.6;
  wdQ.push(i); wdFlush(); }
function wdScore(n,o,d,v){ var p=wdCall('getOrCreateLeaderboard',n,o,d);
  p&&p.then&&p.then(function(r){ if(r&&r.success&&r.data&&r.data.id)
    wdCall('uploadLeaderboardScore',r.data.id,v|0,true); }); }
// Fin de partie, gagnee ou perdue. Un score de zero reste un score.
function wdEnd(w){ wdScore('unicorns-felled-v1',1,0,kills);
  if(w){ wdAward('ROYGBIV');
    if(lit>=7) wdAward('PERFECT_PRISM');
    if(T<150) wdAward('SPEED_OF_LIGHT');     // 150 s : une victoire pilotee en a pris 167
    wdScore('fastest-rainbow-v1',0,1,T); } }
wdCall('init');
var wdS=wdCall('requestStats');
wdS&&wdS.then&&wdS.then(function(r){ wdOk=!!(r&&r.success&&r.data===true); wdFlush(); });

// ---------- loop ----------
recalc();
var last=0;
function loop(t){ var dt=mn(0.05,(t-last)/1000)||0; last=t;
  if(wdBq.length&&(wdBl-=dt)<=0){ wdBq.shift(); wdBl=2.6; }
  if(mode==='title') T+=dt;
  // arret sur image: le monde se fige un instant sur les impacts marquants
  if(freeze>0){ freeze-=dt; dt*=0.14; }
  update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script></body></html>
